<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <meta name="description" content="Contactos e portefólio de Margarida Correia.">
  <title>Margarida Correia · Contactos</title>
  <style>
    :root{color-scheme:dark;--bg:#171717;--card:#262626;--yellow:#f7b52c;--orange:#ee8a28;--text:#fff;--muted:#d4d4d4}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:32px 20px}
    main{width:100%;max-width:430px;text-align:center}.logo{height:70px;width:70px;border-radius:50%;background:var(--yellow);color:#171717;display:grid;place-items:center;margin:0 auto 22px;font-size:23px;font-weight:800;letter-spacing:-1px}
    h1{font-size:32px;letter-spacing:-.7px;margin:0 0 12px}.tag{color:var(--yellow);font-size:11px;font-weight:750;letter-spacing:1.5px;line-height:1.8;margin:0 0 14px}.intro{color:var(--muted);font-size:15px;line-height:1.6;margin:0 0 34px}
    nav{display:grid;gap:13px}.link{display:flex;align-items:center;justify-content:space-between;text-align:left;text-decoration:none;font-size:16px;font-weight:650;padding:18px 20px;border:1px solid var(--orange);background:var(--card);color:#fff;border-radius:12px;transition:transform .15s,background .15s}.link:hover,.link:focus-visible{transform:translateY(-2px);background:#333;outline:2px solid var(--yellow);outline-offset:2px}.link.primary{background:var(--yellow);color:#171717;border-color:var(--yellow)}.link.primary:hover{background:#ffca55}.arrow{font-size:21px;font-weight:400}
    .dots{display:flex;justify-content:center;gap:8px;margin-top:38px}.dots i{height:8px;width:8px;border-radius:50%;background:var(--yellow)}.dots i:nth-child(2){background:var(--orange)}.dots i:nth-child(3){background:#e76525}footer{color:#999;font-size:12px;margin-top:22px}
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-label="Iniciais MC">MC</div>
    <h1>Margarida Correia</h1>
    <p class="tag">MARKETING · STRATEGY · DIGITAL INNOVATION</p>
    <p class="intro">Ideias, projetos e boas conversas começam aqui.</p>
    <nav aria-label="Ligações profissionais">
      <a class="link primary" href="https://margarida-correia.github.io/?lang=pt">Ver portefólio <span class="arrow" aria-hidden="true">↗</span></a>
      <a class="link" href="https://www.linkedin.com/in/margarida-correia-/" target="_blank" rel="noopener noreferrer">LinkedIn <span class="arrow" aria-hidden="true">↗</span></a>
      <a class="link" href="mailto:correia.freitas.margarida@gmail.com">Contactar por email <span class="arrow" aria-hidden="true">↗</span></a>
    </nav>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <footer>Vamos manter o contacto.</footer>
  </main>
</body>
</html>
